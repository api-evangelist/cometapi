naftiko: 1.0.0-alpha2
info:
  label: CometAPI Unified API — Audio
  description: 'CometAPI Unified API — Audio. 2 operations. Lead operation: Create speech. Self-contained Naftiko capability
    covering one Cometapi business surface.'
  tags:
  - Cometapi
  - Audio
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COMETAPI_API_KEY: COMETAPI_API_KEY
capability:
  consumes:
  - type: http
    namespace: unified-audio
    baseUri: https://api.cometapi.com/v1
    description: CometAPI Unified API — Audio business capability. Self-contained, no shared references.
    resources:
    - name: audio-speech
      path: /audio/speech
      operations:
      - name: createspeech
        method: POST
        description: Create speech
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: audio-transcriptions
      path: /audio/transcriptions
      operations:
      - name: createtranscription
        method: POST
        description: Transcribe audio
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.COMETAPI_API_KEY}}'
  exposes:
  - type: rest
    namespace: unified-audio-rest
    port: 8080
    description: REST adapter for CometAPI Unified API — Audio. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/audio/speech
      name: audio-speech
      description: REST surface for audio-speech.
      operations:
      - method: POST
        name: createspeech
        description: Create speech
        call: unified-audio.createspeech
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/audio/transcriptions
      name: audio-transcriptions
      description: REST surface for audio-transcriptions.
      operations:
      - method: POST
        name: createtranscription
        description: Transcribe audio
        call: unified-audio.createtranscription
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: unified-audio-mcp
    port: 9090
    transport: http
    description: MCP adapter for CometAPI Unified API — Audio. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: create-speech
      description: Create speech
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: unified-audio.createspeech
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: transcribe-audio
      description: Transcribe audio
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: unified-audio.createtranscription
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
