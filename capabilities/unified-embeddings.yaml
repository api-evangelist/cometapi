naftiko: 1.0.0-alpha2
info:
  label: CometAPI Unified API — Embeddings
  description: 'CometAPI Unified API — Embeddings. 1 operations. Lead operation: Create embedding. Self-contained Naftiko
    capability covering one Cometapi business surface.'
  tags:
  - Cometapi
  - Embeddings
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COMETAPI_API_KEY: COMETAPI_API_KEY
capability:
  consumes:
  - type: http
    namespace: unified-embeddings
    baseUri: https://api.cometapi.com/v1
    description: CometAPI Unified API — Embeddings business capability. Self-contained, no shared references.
    resources:
    - name: embeddings
      path: /embeddings
      operations:
      - name: createembedding
        method: POST
        description: Create embedding
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.COMETAPI_API_KEY}}'
  exposes:
  - type: rest
    namespace: unified-embeddings-rest
    port: 8080
    description: REST adapter for CometAPI Unified API — Embeddings. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/embeddings
      name: embeddings
      description: REST surface for embeddings.
      operations:
      - method: POST
        name: createembedding
        description: Create embedding
        call: unified-embeddings.createembedding
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: unified-embeddings-mcp
    port: 9090
    transport: http
    description: MCP adapter for CometAPI Unified API — Embeddings. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: create-embedding
      description: Create embedding
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: unified-embeddings.createembedding
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
