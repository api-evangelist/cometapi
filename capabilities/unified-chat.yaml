naftiko: 1.0.0-alpha2
info:
  label: CometAPI Unified API — Chat
  description: 'CometAPI Unified API — Chat. 1 operations. Lead operation: Create chat completion. Self-contained Naftiko
    capability covering one Cometapi business surface.'
  tags:
  - Cometapi
  - Chat
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COMETAPI_API_KEY: COMETAPI_API_KEY
capability:
  consumes:
  - type: http
    namespace: unified-chat
    baseUri: https://api.cometapi.com/v1
    description: CometAPI Unified API — Chat business capability. Self-contained, no shared references.
    resources:
    - name: chat-completions
      path: /chat/completions
      operations:
      - name: createchatcompletion
        method: POST
        description: Create chat completion
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.COMETAPI_API_KEY}}'
  exposes:
  - type: rest
    namespace: unified-chat-rest
    port: 8080
    description: REST adapter for CometAPI Unified API — Chat. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/chat/completions
      name: chat-completions
      description: REST surface for chat-completions.
      operations:
      - method: POST
        name: createchatcompletion
        description: Create chat completion
        call: unified-chat.createchatcompletion
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: unified-chat-mcp
    port: 9090
    transport: http
    description: MCP adapter for CometAPI Unified API — Chat. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: create-chat-completion
      description: Create chat completion
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: unified-chat.createchatcompletion
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
