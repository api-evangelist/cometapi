naftiko: 1.0.0-alpha2
info:
  label: CometAPI Unified API — Models
  description: 'CometAPI Unified API — Models. 1 operations. Lead operation: List models. Self-contained Naftiko capability
    covering one Cometapi business surface.'
  tags:
  - Cometapi
  - Models
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COMETAPI_API_KEY: COMETAPI_API_KEY
capability:
  consumes:
  - type: http
    namespace: unified-models
    baseUri: https://api.cometapi.com/v1
    description: CometAPI Unified API — Models business capability. Self-contained, no shared references.
    resources:
    - name: models
      path: /models
      operations:
      - name: listmodels
        method: GET
        description: List models
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.COMETAPI_API_KEY}}'
  exposes:
  - type: rest
    namespace: unified-models-rest
    port: 8080
    description: REST adapter for CometAPI Unified API — Models. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/models
      name: models
      description: REST surface for models.
      operations:
      - method: GET
        name: listmodels
        description: List models
        call: unified-models.listmodels
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: unified-models-mcp
    port: 9090
    transport: http
    description: MCP adapter for CometAPI Unified API — Models. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-models
      description: List models
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: unified-models.listmodels
      outputParameters:
      - type: object
        mapping: $.
