naftiko: 1.0.0-alpha2
info:
  label: CometAPI Unified API — Video
  description: 'CometAPI Unified API — Video. 1 operations. Lead operation: Generate video. Self-contained Naftiko capability
    covering one Cometapi business surface.'
  tags:
  - Cometapi
  - Video
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    COMETAPI_API_KEY: COMETAPI_API_KEY
capability:
  consumes:
  - type: http
    namespace: unified-video
    baseUri: https://api.cometapi.com/v1
    description: CometAPI Unified API — Video business capability. Self-contained, no shared references.
    resources:
    - name: videos-generations
      path: /videos/generations
      operations:
      - name: createvideo
        method: POST
        description: Generate video
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.COMETAPI_API_KEY}}'
  exposes:
  - type: rest
    namespace: unified-video-rest
    port: 8080
    description: REST adapter for CometAPI Unified API — Video. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/videos/generations
      name: videos-generations
      description: REST surface for videos-generations.
      operations:
      - method: POST
        name: createvideo
        description: Generate video
        call: unified-video.createvideo
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: unified-video-mcp
    port: 9090
    transport: http
    description: MCP adapter for CometAPI Unified API — Video. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: generate-video
      description: Generate video
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: unified-video.createvideo
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
